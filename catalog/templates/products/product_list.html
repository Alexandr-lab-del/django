   {% extends 'products/base.html' %}
   {% load my_tags %}
   {% block content %}
   <div class="album py-5 bg-body-tertiary">
       <div class="container">
         <h2 class="mb-4">Продукты</h2>
         <!-- Кнопка создания нового продукта -->
         <p>
           <a class="btn btn-success" href="{% url 'catalog:product_create' %}">Создать новый продукт</a>
         </p>
         <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
           {% for product in object_list %}
           <div class="col">
             <div class="card shadow-sm">
               <img class="product-image" src="{{ product.image | media_filter }}">
               <div class="card-body">
                 <p class="card-text">{{ product.name }}</p>
                 <p class="card-text">Описание: {{ product.description | truncatechars:100 }}</p>
                 <div class="d-flex justify-content-between align-items-center">
                   <div class="btn-group">
                     <a class="btn btn-primary" href="{% url 'catalog:product_detail' product.pk %}" role="button">Посмотреть</a>
                     <a class="btn btn-secondary" href="{% url 'catalog:product_update' product.pk %}" role="button">Изменить</a>
                     <a class="btn btn-danger" href="{% url 'catalog:product_delete' product.pk %}" role="button">Удалить</a>
                   </div>
                   <small class="text-body-secondary">9 mins</small>
                 </div>
               </div>
             </div>
           </div>
           {% endfor %}
         </div>
       </div>
     </div>
   {% endblock %}
