<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if object %}Редактировать пост{% else %}Создать пост{% endif %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background: #35424a;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background: #434f5b;
        }
    </style>
</head>
<body>
    <h1>{% if object %}Редактировать пост{% else %}Создать пост{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="title">Заголовок:</label>
        <input type="text" id="title" name="title" value="{{ object.title|default:'' }}" required>

        <label for="content">Содержимое:</label>
        <textarea id="content" name="content" required>{{ object.content|default:'' }}</textarea>

        <label for="is_published">Опубликован:</label>
        <input type="checkbox" id="is_published" name="is_published" {% if object.is_published %}checked{% endif %}>

        <label for="preview_image">Превью (изображение):</label>
        <input type="file" id="preview_image" name="preview_image">

        <input type="submit" value="{% if object %}Сохранить изменения{% else %}Создать пост{% endif %}">
    </form>
    <br>
    <a href="{% url 'blog:post_list' %}">Назад к списку</a>
</body>
</html>
